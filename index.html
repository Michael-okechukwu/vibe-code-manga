<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">MangaSite</div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#browse">Browse</a></li>
            </ul>
            <div class="search-container">
                <input type="text" placeholder="Search...">
                <button>Search</button>
            </div>
            <div class="user-auth">
                <button id="login-btn">Login</button>
                <button id="signup-btn">Sign Up</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="home">
            <section id="popular">
                <h2>Popular Manga</h2>
                <div class="manga-grid"></div>
            </section>
            <section id="new-releases">
                <h2>New Releases</h2>
                <div class="manga-grid"></div>
            </section>
            <section id="recently-updated">
                <h2>Recently Updated</h2>
                <div class="manga-grid"></div>
            </section>
        </section>

        <section id="browse" class="hidden">
            <h2>Browse All Manga</h2>
            <div class="manga-grid"></div>
        </section>

        <section id="manga-details" class="hidden">
            <!-- Manga details will be dynamically injected here -->
        </section>

        <section id="chapter-reader" class="hidden">
            <!-- Chapter reader will be dynamically injected here -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MangaSite. All rights reserved.</p>
    </footer>

    <!-- Modals -->
    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <div id="signup-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Sign Up</h2>
            <form id="signup-form">
                <input type="text" placeholder="Username" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
